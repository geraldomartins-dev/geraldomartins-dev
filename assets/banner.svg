<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Geraldo Martins — Desenvolvedor Full Stack</title>
  <desc id="desc">Banner escuro com grade técnica, detalhes em verde ácido e violeta.</desc>
  <defs>
    <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
      <path d="M38 0H0V38" fill="none" stroke="#32382f" stroke-width="1" opacity=".48"/>
    </pattern>
    <radialGradient id="glowA" cx="0" cy="0" r="1" gradientTransform="translate(1020 60) rotate(140) scale(420 320)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#C6FF67" stop-opacity=".2"/>
      <stop offset="1" stop-color="#C6FF67" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0" cy="0" r="1" gradientTransform="translate(900 330) rotate(-90) scale(300 430)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#A98AFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#A98AFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="360" rx="20" fill="#070807"/>
  <rect width="1200" height="360" rx="20" fill="url(#grid)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowA)"/>
  <rect width="1200" height="360" rx="20" fill="url(#glowB)"/>
  <circle cx="1100" cy="78" r="86" fill="none" stroke="#C6FF67" stroke-opacity=".22"/>
  <circle cx="1100" cy="78" r="54" fill="none" stroke="#A98AFF" stroke-opacity=".32"/>
  <path d="M1038 78h124M1100 16v124" stroke="#C6FF67" stroke-opacity=".22"/>
  <rect x="64" y="54" width="176" height="30" rx="15" fill="#111410" stroke="#343A32"/>
  <circle cx="84" cy="69" r="4" fill="#C6FF67" filter="url(#soft)"/>
  <circle cx="84" cy="69" r="4" fill="#C6FF67"/>
  <text x="98" y="73" fill="#BFC5BB" font-family="Consolas, monospace" font-size="11" letter-spacing="1.5">DISPONÍVEL PARA CRIAR</text>
  <text x="64" y="151" fill="#F4F5ED" font-family="Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-2">Geraldo Martins</text>
  <text x="66" y="199" fill="#A98AFF" font-family="Georgia, serif" font-size="29" font-style="italic">Desenvolvedor web full-stack</text>
  <text x="66" y="255" fill="#AEB3AA" font-family="Consolas, monospace" font-size="15">Soluções úteis. Código seguro. Experiências claras.</text>
  <path d="M66 292h430" stroke="#292D28"/>
  <text x="66" y="322" fill="#C6FF67" font-family="Consolas, monospace" font-size="12" letter-spacing="1.4">PROBLEMA → ANÁLISE → CÓDIGO → IMPACTO</text>
  <path d="M1152 314l-22 0 22-22" fill="none" stroke="#C6FF67" stroke-width="2"/>
</svg>
